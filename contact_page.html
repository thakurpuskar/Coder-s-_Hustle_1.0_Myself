<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Central Campus of Technology</title>
  <link rel="shortcut icon" href="./Images/logo.png" type="image/svg+xml">
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="form-page">

  <header class="site-header">
    <nav>
      <a href="./index.html" class="brand">
        <img src="./Images/logo-removebg-preview.png" alt="Central Campus of Technology logo">
        <span class="brand-name">Central Campus<span>of Technology</span></span>
      </a>
      <button class="menu-icon" onclick="showmenu()" aria-label="Open menu">&#9776;</button>
      <div class="nav-links" id="navLinks">
        <button class="close-icon" onclick="hidemenu()" aria-label="Close menu">&#10005;</button>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./admission_page.html">Admission</a></li>
          <li><a href="./index.html#course_call">Programs</a></li>
          <li><a href="./fees_page.html">Fees</a></li>
          <li><a href="./contact_page.html">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div>
        <p class="hero-eyebrow">CONTACT</p>
        <h1>Get in touch</h1>
        <p class="hero-lede">Questions about a program, admission, or campus life — send us a message and we'll get back to you by email.</p>
      </div>
    </div>
  </section>

  <div class="form-shell">
    <div class="form-card">
      <h2>Contact form</h2>
      <p>We typically reply within one to two business days.</p>

      <form method="post" onsubmit="sendmail(); this.reset(); return false;">

        <div class="field">
          <label for="yourname">Your name</label>
          <div class="field-input">
            <i class="fa fa-user"></i>
            <input type="text" name="your name" id="yourname" placeholder="Enter your name" required>
          </div>
        </div>

        <div class="field">
          <label for="emailaddress">Email address</label>
          <div class="field-input">
            <i class="fa fa-envelope"></i>
            <input type="email" name="email address" id="emailaddress" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">Message</label>
          <div class="field-input">
            <i class="fa fa-commenting"></i>
            <textarea name="phone" id="phone" placeholder="Write your message..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <input type="submit" class="btn btn-primary btn-block" value="Send message">
          <input type="reset" class="btn btn-secondary btn-block" value="Clear">
        </div>

      </form>
    </div>
  </div>

  <script src="./main_script.js"></script>
</body>
</html>
